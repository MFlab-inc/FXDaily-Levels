name: MTF Add Symbol (temporary)

# 一時的なワークフロー（PR の中で NZDUSD の履歴を1回だけ取得するため。取得したら削除する）。
# このブランチへの push（このファイルの変更）で動く。履歴CSVが既にあれば何も取得せず失敗して止まる（1回だけ）。
on:
  push:
    branches: [feature/mtf-nzdusd]
    paths: [".github/workflows/mtf-add-symbol-trial.yml"]

permissions:
  contents: write
  actions: read   # 他の Daily / Intraday が実行中かを確認するため

concurrency:
  group: mtf-add-symbol-trial
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Add NZDUSD history
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node mtf/add-symbol.js NZDUSD

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mtf data/mtf-feed.json data/mtf-feed.txt
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "data: MTF に NZDUSD を追加（履歴を1回だけ取得）"
          for i in 1 2 3; do
            git push && exit 0
            echo "push失敗（${i}回目）。rebaseして再試行"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1

name: TMP MTF trial

# 【一時的】MTF判定フィードの試験運転（仕様 5-0）。PRのブランチへの push で動く。マージ前にこのファイルと mtf/trial.js を取り除く。
# 結果はジョブのログに出すだけ（コミットしない）。Twelve Data は1分あたり30回以内。
# daily / intraday の実行中・起動分は自動で避ける。APIキーはログに出さない。
on:
  push:
    branches:
      - claude/mtf-feed
    paths:
      - ".github/workflows/tmp-mtf-trial.yml"
      - "mtf/trial.js"

permissions:
  contents: read
  actions: read

concurrency:
  group: tmp-mtf-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run MTF trial
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node mtf/trial.js

name: Risk Tests

on:
  pull_request:
    paths:
      - "risk/**"
      - "mtf/lib/ny-time.js"
      - ".github/workflows/risk*.yml"
      # risk.yml の workflow_run が参照する name: を確かめる試験（risk/test/workflows.test.js）が読むファイル
      - ".github/workflows/intraday.yml"
      - ".github/workflows/daily.yml"
  push:
    branches: [main]
    paths:
      - "risk/**"
      - "mtf/lib/ny-time.js"
      - ".github/workflows/risk*.yml"
      - ".github/workflows/intraday.yml"
      - ".github/workflows/daily.yml"

permissions:
  contents: read

# 取引可否の指標（risk/）の試験。外部へは接続しない（VIX は試験用に作った値、予定表は risk/events.csv）。
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run risk tests
        run: node --test risk/test/*.test.js

  # 参考：PR の段階で、Cboe の実データを実際に取得できるか、順位がいくつになるかを見る（リポジトリには書かない）。
  # 公開リポジトリのため、終値そのものはログにも出さない（順位と個数だけ。SPEC 6節）。
  # 取得できなくても試験の合否には影響させない（相手のサイトの都合で PR が止まらないように）。
  live-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 結果は注釈（::notice）でも出す。ログ本文を読めない環境（作業用の Claude のセッションなど）からも、
      # check-runs の annotations API で読めるようにするため。改行は入れない。
      - name: Fetch live data into a temporary folder
        run: |
          set +e
          node risk/run-daily.js --data-dir "$RUNNER_TEMP/risk" > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          while IFS= read -r line; do echo "::notice title=run-daily（終了コード ${code}）::${line}"; done < "$RUNNER_TEMP/out.txt"
          [ -f "$RUNNER_TEMP/risk/risk.json" ] || exit 1
          node -e '
            const d = require(process.env.RUNNER_TEMP + "/risk/risk.json");
            const { history, ...v } = d.vix || {};
            const src = v.source || {};
            console.log("::notice title=VIX（実データ）::" + JSON.stringify({ date: v.date, rank_pct: v.rank_pct, count_le: v.count_le, window_start: v.window_start, last_modified: src.last_modified, warnings: v.warnings }));
            console.log("::notice title=VIXの履歴（実データ、日付=順位）::" + (history || []).map((h) => `${h.date}=${h.rank_pct}`).join(" "));
            const e = d.event || {};
            console.log("::notice title=イベント警戒::" + JSON.stringify({ level: e.level, base_jst: e.base_jst, count: e.count, items: (e.items || []).map((i) => `${i.kind}@${i.at_jst}`) }));
            console.log("::notice title=generation::" + JSON.stringify(d.generation));
          '
          exit $code

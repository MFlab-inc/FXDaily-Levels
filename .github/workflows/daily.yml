name: Daily FX Data

on:
  schedule:
    # 23:30 UTC 月〜金 = 火〜土 8:30 JST
    - cron: "13 22 * * 1-5"
  workflow_dispatch: {}  # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch FX data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: node fetch.js

      - name: Build GPT feed
        run: node build-feed.js

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # intraday.yml等と同じリポジトリへ押し合うことがある。素のpushだと
          # 非fast-forwardで失敗し、せっかく取得したdaily-levels.jsonが
          # 一切保存されないまま実行全体が失敗する（charts.ymlと同じ対策）。
          for i in 1 2 3; do
            git push && exit 0
            echo "push失敗（${i}回目）。rebaseして再試行"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::data/のpushに3回失敗しました。daily-levels.jsonが更新されていません"
          exit 1

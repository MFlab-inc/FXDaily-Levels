name: Daily FX Data

on:
  schedule:
    # 全て「前営業日セッション」を対象にした同一内容の実行。最初に届いた1本が仕事をし、
    # 残りは fetch.js --if-stale が即終了する（APIクレジット消費ゼロ）。
    #
    # 冗長化の理由: GitHubのスケジュール配信はベストエフォートで、本リポジトリでは
    # 22:13Zのcronが実測で25分〜約8時間遅れて発火している（2026-08-28は06:05Z=15:05 JST）。
    # 単発cronだと、その遅延がそのまま「フィードが午前中ずっと前日値のまま」になる。
    #
    # 2026-09-30に判明: 4本の固定時刻cron（07:13/08:41/10:23/12:23 JST）が
    # 「その日の分が全て」届かず、朝の間ずっと1本も発火しない事例が発生した
    # （intraday.yml側の15分毎cronでも同様に数時間〜半日規模の欠落が常態的に
    # 見られ、GitHub側のschedule配信自体がこのアカウント/リポジトリでは
    # 相当に不安定と判断）。個々のcronが届くかどうかを賭けるのではなく、
    # 「発火の試行回数」自体を大きく増やして母数で当てにいく方針に変更する。
    # --if-stale で健全時は無料（API呼び出しゼロ）なので、頻度を上げても
    # 通常朝のコストは変わらない。
    #
    # UTC↔JSTの曜日に注意: 22〜23時台のUTCは翌日のJSTなので曜日は 1-5（月〜金UTC=火〜土JST）、
    # 00時台以降のUTCは同じ日のJST午前なので曜日を+1して 2-6 にする。ここを 1-5 のままにすると
    # JST月曜の午前に誤発火し、対象セッションが前週金曜のまま上書きされる。
    - cron: "*/15 22-23 * * 1-5"  # JST 火〜土 07:00〜08:59、15分毎
    - cron: "*/15 0-4 * * 2-6"    # JST 火〜土 09:00〜13:59、15分毎
  # 手動実行、および外部の定期実行サービスからのAPI起動用。
  # GitHubのscheduleは本リポジトリでは数時間遅れて届き（9/5以降、最初の着弾が09:00〜11:00 JST）、
  # 朝9時の利用に間に合わないため、時刻どおりに起動できる外部cronからこちらを呼ぶ。
  # 外部cronは if_stale=true で呼ぶ。健全なら外部APIを呼ばず即終了するので、
  # 同じ朝に何度呼んでもAPIクレジットを消費しない。
  workflow_dispatch:
    inputs:
      if_stale:
        description: "健全なら外部APIを呼ばず終了する（外部cron用）。手動で必ず再取得したい時はオフのまま"
        type: boolean
        default: false

permissions:
  contents: write

# 遅延した複数のcronが束になって発火した場合に、同じdata/へ同時にpushしないようにする
concurrency:
  group: daily-fx-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 外部APIのハングでジョブが既定の6時間居座るのを防ぐ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch FX data
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        # schedule実行と、外部cronからの if_stale=true の起動では --if-stale を付ける。
        # 既に当日分が健全に揃っていれば fetch.js が外部APIを一切呼ばずに即終了する。
        # 手動実行（if_stale 既定オフ）は常に再取得。
        run: node fetch.js ${{ (github.event_name == 'schedule' || inputs.if_stale) && '--if-stale' || '' }}

      # MTF判定フィード（data/mtf-feed.*、日足の履歴 data/mtf/）。失敗しても上の価格フィードの更新は止めない
      # （continue-on-error）。fetch.js のエラーには混ぜないので、鮮度の判定にも影響しない。
      # 履歴CSVが無い間（過去分の取得 MTF Backfill の前）と、その日の分を作成済みの間は何もしない。
      - name: Build MTF feed
        continue-on-error: true
        timeout-minutes: 5   # 通常は30秒前後。内部にも170秒の時間制限がある（超えても下のコミットまで進む）
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: node mtf/run-daily.js

      - name: Build GPT feed
        run: node build-feed.js

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "data: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # intraday.yml等と同じリポジトリへ押し合うことがある。素のpushだと
          # 非fast-forwardで失敗し、せっかく取得したdaily-levels.jsonが
          # 一切保存されないまま実行全体が失敗する（charts.ymlと同じ対策）。
          for i in 1 2 3; do
            git push && exit 0
            echo "push失敗（${i}回目）。rebaseして再試行"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::data/のpushに3回失敗しました。daily-levels.jsonが更新されていません"
          exit 1

      # 取得に失敗した銘柄があれば、コミット後に実行を赤くして気づけるようにする。
      # 順序が重要: 先にpushしておかないと、エラー内容を載せたdaily-levels.json自体が
      # 下流に届かないまま実行だけが赤くなり、下流は「前日値のまま・理由不明」になる。
      - name: Assert feed completeness
        run: |
          node -e '
            const d = require("./data/daily-levels.json");
            const g = d.generation || {};
            console.log(`status=${g.status} complete=${g.complete} errors=${(d.errors||[]).length} session_date=${d.session_date}`);
            if (g.complete) process.exit(0);
            for (const e of d.errors || []) console.log(`::error::daily-levels: ${e}`);
            console.log(`::error::daily-levels.jsonが不完全です（欠落: ${(g.coverage?.pairs?.missing || []).join(",") || "なし"}）。retry_expected=${g.retry_expected}`);
            process.exit(1);
          '

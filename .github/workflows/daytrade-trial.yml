name: Daytrade Trial (temporary)

# 一時的な試験運転用（PRの確認が終わったら削除する）。feature/daytrade-plan への push でだけ動く。
#   design  : main の最新のデータ（コミットしない）で、実データの設計を1回実行し、出力をログに出す
#   backtest: scripts/daytrade-backtest.js を1回実行し、履歴CSVと結果をこのブランチにコミットする
on:
  push:
    branches: [feature/daytrade-plan]
    paths: [".github/workflows/daytrade-trial.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: daytrade-trial
  cancel-in-progress: false

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Use the latest data from main (not committed)
        run: |
          git fetch origin main
          git checkout origin/main -- data/intraday.json data/daily-levels.json data/h1-bars.json data/daytrade-context.json data/mtf-feed.json data/mtf-feed.txt data/economic-calendar.json data/mtf
          git status --short | head
      - name: Unit tests
        run: node --test scripts/daytrade/test/*.test.js mtf/test/*.test.js
      - name: Design (real data)
        run: |
          date -u
          node scripts/daytrade-plan.js --run=design --slot=3 --force
          echo "=================== data/daytrade-plan.txt ==================="
          cat data/daytrade-plan.txt
          { echo '```'; cat data/daytrade-plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "=================== data/daytrade/log.csv ==================="
          cat data/daytrade/log.csv
      - name: Status (real data, right after the design)
        run: |
          node scripts/daytrade-plan.js --run=status --force --dry-run | head -40
      - name: Score (nothing to score yet)
        run: node scripts/daytrade-score.js

  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run backtest
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/daytrade-backtest.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history data/daytrade/backtest-*.md data/daytrade/backtest-*.csv
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "daytrade: backtest trial run $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push失敗（${i}回目）。rebaseして再試行"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1

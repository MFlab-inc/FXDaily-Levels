name: Intraday Snapshot

on:
  schedule:
    # 24時間運用: 月9:02〜土8:47 JST 15分ごと（毎時2,17,32,47分 = M15確定2分後・混雑回避）
    - cron: "2,17,32,47 * * * 1-5"
    # 月曜早朝カバー: 日曜UTC夜 = 月曜6:02〜8:47 JST
    - cron: "2,17,32,47 21-23 * * 0"
  # 手動実行、および外部の定期実行サービスからのAPI起動（docs/intraday-external-cron.md。本文は {"ref":"main"} で、inputs は付けない）。
  workflow_dispatch:
    inputs:
      force:
        description: "直前の取得から5分未満でも、必ず再取得する（手動で確実に更新したい時だけ。外部cronは指定しない）"
        type: boolean
        default: false
  # Daily FX Data（daily-levels.json生成）完了直後にも1回実行する。
  # dailyは通常8:30 JST頃だが遅延することがあり、そのタイミングでこのスケジュールの
  # 定期実行と交錯すると、h1-bars.jsonのconsistency_check.checked_against（照合時点の
  # daily as_of/session_date）が古いdailyのまま残り、次の15分間隔の実行まで新しいdaily
  # と世代が合わない状態になる（実例: 2026-08-27朝、daily完了8/27 10:33の7分前にintraday
  # が8/26版dailyを参照して実行され、突合記録が1世代古いまま残った）。
  # dailyの完了を直接のトリガーにすることで、この不整合ウィンドウを最短化する。
  workflow_run:
    workflows: ["Daily FX Data"]
    types: [completed]

permissions:
  contents: write

# Intraday Snapshot を同時に2本動かさない。起動元は3つある（外部cron の毎時 :05・:23・:35・:50、GitHub の schedule の :02・:17・:32・:47
# 〔遅れて届くことがある〕、Daily FX Data 完了時の workflow_run）。同じ分に重なると、Twelve Data のクレジット（1回あたり約31）が二重に使われて
# 1分あたりの上限（55）を超え（2026-10-13 05:50 JST に1分57クレジット）、同じ data/ への push も衝突する（その回の schedule 側は
# 「Commit and push data」で失敗した）。後から来た方は前の完了を待つ（cancel-in-progress: false）。
# 待機できる run は1つだけで、待機中にさらに新しい run が来ると古い待機は取り消される。どれも同じ仕事なので問題ない
# （次に動く run は、前の取得から5分未満なら intraday.js・daytrade.js が API を呼ばずに終わる）。
concurrency:
  group: intraday-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # workflow_run経由はdailyが成功した時のみ（失敗直後に古いdailyへ再突合しても無意味なため）。
    # schedule/workflow_dispatch経由は従来通り常に実行する。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 前の run を待つ仕組み（concurrency）なので、止まった run が後続を長く塞がないようにする。通常は30秒前後（直近1週間の最大 64秒）
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch intraday quotes
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        # 直前の取得から5分未満なら API を呼ばずに成功で終わる（--force または手動実行の force で必ず取得）。
        # 終了コードは 0 のままなので、後続の手順と Daytrade Plan（workflow_run）は今までどおり動く
        run: node intraday.js ${{ inputs.force && '--force' || '' }}

      # daytrade.js（h1-bars.json生成）はintraday.jsの出力に一切依存しない独立処理。
      # 以前はintraday.jsが例外で落ちると、GitHub Actionsの既定動作でここから下が
      # 丸ごとスキップされ、無関係なh1-bars.json（チャート用データ）まで更新されなく
      # なっていた。intraday.js側にリトライ・タイムアウトを入れて滅多に落ちないように
      # した上で、それでも落ちた場合に備えてここは !cancelled() で独立実行させる。
      # ジョブ全体の成否は素のfailureのまま伝播するため、赤くなる可視性は失われない
      # （手動キャンセル時だけ後続もスキップされる）。
      - name: Build daytrade context
        if: ${{ !cancelled() }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        # intraday.js と同じ。直前の取得から5分未満なら API を呼ばずに成功で終わる
        run: node daytrade.js ${{ inputs.force && '--force' || '' }}

      - name: Build GPT feed
        if: ${{ !cancelled() }}
        run: node build-feed.js

      - name: Commit and push data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json data/economic-calendar.json data/daytrade-context.json data/h1-bars.json data/gpt-feed.html data/gpt-feed.txt data/feed.csv data/history.csv
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "intraday: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          # daily.yml等と同じリポジトリへ押し合うことがある。素のpushだと
          # 非fast-forwardで失敗し、せっかく取得したh1-bars.json等が
          # 一切保存されないまま実行全体が失敗する（charts.ymlと同じ対策）。
          for i in 1 2 3; do
            git push && exit 0
            echo "push失敗（${i}回目）。rebaseして再試行"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::data/のpushに3回失敗しました。h1-bars.json等が更新されていません"
          exit 1

name: TMP Twelve Data probe

# 一時的な実API確認（EURUSD 1銘柄・リクエスト10回以内・ログ出力のみ）。mainにはマージしない。
# このブランチへのpushでだけ動く。確認が終わったらブランチごと削除する。
on:
  push:
    branches:
      - claude/tmp-twelvedata-probe

permissions:
  contents: read
  actions: read  # daily / intraday が実行中でないかを確認するため

concurrency:
  group: tmp-twelvedata-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe Twelve Data (EURUSD only, log only)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node tmp-probe/probe.js

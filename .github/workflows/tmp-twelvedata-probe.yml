name: TMP Twelve Data probe

# 一時的な実API確認 第3弾（EURUSD・追加3回。第2弾の7回と合わせて合計10回以内・ログ出力のみ）。mainにはマージしない。
# このブランチへのpushでだけ動く。確認が終わったらワークフローを取り除く。
on:
  push:
    branches:
      - claude/tmp-twelvedata-probe

permissions:
  contents: read
  actions: read  # daily / intraday が実行中でないかを確認するため

concurrency:
  group: tmp-twelvedata-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe Twelve Data round 3 (log only)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TZ: UTC
        run: node tmp-probe/probe3.js
